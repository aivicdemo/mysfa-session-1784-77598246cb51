<html lang="ja">
<head>
  <meta charset="UTF-8">

  <style>
:root {
  --primary: #0070d2;
  --primary-hover: #005fb8;
  --bg-main: #f3f3f3;
  --bg-card: #ffffff;
  --bg-sidebar: #f8f8f8;
  --border: #d3d3d3;
  --text: #1a1a1a;
  --text-muted: #565656;
  --top-bar-bg: #ffffff;
  --top-bar-border: #d3d3d3;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  background: var(--bg-main);
  color: var(--text);
  line-height: 1.4;
}

.app-container {
  display: flex;
  height: 100vh;
  flex-direction: column;
}

header {
  background: var(--top-bar-bg);
  border-bottom: 1px solid var(--top-bar-border);
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.header-logo {
  font-size: 18px;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: -0.5px;
}

.header-user-area {
  display: flex;
  align-items: center;
  gap: 12px;
}

.user-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--primary);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  flex-shrink: 0;
}

.user-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
}

.logout-link {
  font-size: 12px;
  color: var(--primary);
  text-decoration: none;
  cursor: pointer;
}

.logout-link:hover {
  color: var(--primary-hover);
}

.main-wrapper {
  display: flex;
  flex: 1;
  overflow: hidden;
}

aside {
  width: 240px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  flex-shrink: 0;
}

.sidebar-section {
  padding: 16px 12px;
}

.sidebar-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-muted);
  letter-spacing: 0.5px;
  padding: 0 12px 8px;
}

.nav-item {
  display: block;
  padding: 10px 12px;
  margin: 2px 0;
  font-size: 13px;
  color: var(--text);
  text-decoration: none;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.15s;
  border-left: 3px solid transparent;
}

.nav-item:hover {
  background: rgba(0, 112, 210, 0.08);
}

.nav-item.aivic-active {
  background: rgba(0, 112, 210, 0.12);
  color: var(--primary);
  border-left-color: var(--primary);
  font-weight: 600;
}

.content-area {
  flex: 1;
  overflow-y: auto;
  background: var(--bg-main);
}

[data-aivic-panel] {
  width: 100%;
  height: 100%;
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  padding: 20px;
}

.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 16px;
}

.kpi-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.3px;
  margin-bottom: 8px;
}

.kpi-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
  line-height: 1;
}

.kpi-change {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 8px;
}

.kpi-change.positive {
  color: #2e7d32;
}

.kpi-change.negative {
  color: #c62828;
}

.page-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-card);
}

.page-title {
  font-size: 24px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}

.page-subtitle {
  font-size: 13px;
  color: var(--text-muted);
}

.toolbar {
  display: flex;
  gap: 12px;
  padding: 16px 20px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  align-items: center;
  flex-wrap: wrap;
}

.search-box {
  flex: 1;
  min-width: 200px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 13px;
  background: var(--bg-main);
}

.btn {
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  background: var(--bg-card);
  color: var(--text);
}

.btn:hover {
  background: var(--bg-main);
  border-color: var(--text-muted);
}

.btn-primary {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

.btn-primary:hover {
  background: var(--primary-hover);
  border-color: var(--primary-hover);
}

.table-wrapper {
  overflow-x: auto;
  padding: 0 20px 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}

thead {
  background: var(--bg-main);
  border-bottom: 1px solid var(--border);
}

th {
  padding: 12px;
  text-align: left;
  font-weight: 600;
  color: var(--text);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

td {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
}

tbody tr:hover {
  background: rgba(0, 112, 210, 0.04);
}

tbody tr:last-child td {
  border-bottom: none;
}

.status-badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.2px;
}

.status-active {
  background: rgba(46, 125, 50, 0.15);
  color: #2e7d32;
}

.status-pending {
  background: rgba(251, 188, 5, 0.15);
  color: #f57f17;
}

.status-closed {
  background: rgba(198, 40, 40, 0.15);
  color: #c62828;
}

.split-panel {
  display: flex;
  gap: 0;
  height: 100%;
}

.split-left {
  width: 35%;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  background: var(--bg-card);
}

.split-right {
  flex: 1;
  overflow-y: auto;
  background: var(--bg-main);
  padding: 20px;
}

.list-item {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.15s;
}

.list-item:hover {
  background: var(--bg-main);
}

.list-item.active {
  background: rgba(0, 112, 210, 0.1);
  border-left: 3px solid var(--primary);
}

.list-item-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}

.list-item-meta {
  font-size: 12px;
  color: var(--text-muted);
}

.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.2px;
}

.form-input {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 13px;
  background: var(--bg-card);
  color: var(--text);
}

.form-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 2px rgba(0, 112, 210, 0.1);
}

.kanban-board {
  display: flex;
  gap: 16px;
  padding: 20px;
  overflow-x: auto;
  height: 100%;
}

.kanban-column {
  flex: 0 0 300px;
  background: var(--bg-main);
  border-radius: 6px;
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}

.kanban-header {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-card);
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

.kanban-count {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 400;
  margin-left: 6px;
}

.kanban-cards {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}

.kanban-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 12px;
  margin-bottom: 12px;
  cursor: grab;
  transition: box-shadow 0.15s;
}

.kanban-card:hover {
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

.kanban-card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

.kanban-card-meta {
  font-size: 11px;
  color: var(--text-muted);
}

.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal {
  background: var(--bg-card);
  border-radius: 6px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);

  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
}

.modal-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
}

  padding: 20px;
}

.modal-footer {
  padding: 16px 20px;
  border-top: 1px solid var(--border);

  gap: 12px;
  justify-content: flex-end;
}

.tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border);
  background: var(--bg-card);
  padding: 0 20px;
}

.tab {
  padding: 12px 16px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);

  border-bottom: 2px solid transparent;

}

.tab:hover {
  color: var(--text);
}

.tab.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
}

.tab-content {
  padding: 20px;
}

.chart-placeholder {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 40px;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
  min-height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.badge {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 2px;
  font-size: 11px;
  font-weight: 600;
  background: rgba(0, 112, 210, 0.1);
  color: var(--primary);
}

.text-muted {
  color: var(--text-muted);
}

.text-small {
  font-size: 12px;
}

.mt-8 { margin-top: 8px; }
.mt-16 { margin-top: 16px; }
.mb-8 { margin-bottom: 8px; }
.mb-16 { margin-bottom: 16px; }
.gap-8 { gap: 8px; }
.gap-16 { gap: 16px; }

明":"顧客から提示された技術要件仕様書に、当初の提案内容と異なる部分が複数確認されました。特にAPI連携部分のプロトコル、データベース容量要件、セキュリティ認証方式の3点で齟齬があります。顧客側の要件確認プロセスが十分でなかったことが原因と推定されます。","優先度":"高","ステータス":"進行中","担当者ID":"rec-user-20240501-089","期限日":"2025-02-28T17:00:00Z","影響度":"高","対応策":"1月20日に顧客の技術責任者と当社システムエンジニアで要件確認会議を開催予定。現在の仕様書との差分を整理し、実装可能性と追加コスト試算を提示。顧客の優先順位に基づいて対応内容を決定し、2月中旬までに修正版仕様書をリリース予定。","作成日時":"2025-01-15T10:30:00Z","作成者ID":"rec-user-20240301-045","更新日時":"2025-01-16T14:20:00Z","更新者ID":"rec-user-20240501-089"},{"課題ID":"rec-001-issue-20250115-001","商談ID":"rec-001-deal-20241201-042","顧客ID":"rec-001-cust-20240615-018","課題タイプ":"懸念事項","タイトル":"競合他社の提案により受注確度が低下","説明":"A社との商談において、競合他社B社が同等の機能を低価格で提案したことが判明。顧客の購買担当者から「B社との比較検討中」との連絡を受けた。現在、受注確度が85%から60%に低下している。顧客側の決定時期は2月末を予定しており、早急な対応が必要な状況。","優先度":"高","ステータス":"進行中","担当者ID":"rec-001-user-20230401-015","期限日":"2025-02-15T17:00:00Z","影響度":"高","対応策":"1.競合他社との差別化ポイント（導入後のサポート体制、カスタマイズ対応力）を整理し、顧客に提示する提案資料を作成。2.顧客のCFOと経営層を交えた価値提案ミーティングを2月1日までに実施。3.導入後の効果測定と ROI シミュレーションを詳細に提示し、総所有コスト（TCO）での優位性を強調。4.契約条件の柔軟化（導入スケジュール、支払い条件）を検討。","作成日時":"2025-01-15T10:30:00Z","作成者ID":"rec-001-user-20230401-008","更新日時":"2025-01-16T14:45:00Z","更新者ID":"rec-001-user-20230401-015"},{"課題ID":"rec-001","商談ID":"rec-102","顧客ID":"rec-203","課題タイプ":"リスク","タイトル":"プロジェクト開始予定日までに契約書サイン未了","説明":"顧客との基本契約書について、法務部門での審査が予定より遅延しており、プロジェクト開始予定日の2025年2月15日までにサイン完了できない可能性が高まっている。現在、顧客の法務担当者との調整待ちの状態が続いている。","優先度":"高","ステータス":"進行中","担当者ID":"rec-301","期限日":"2025-02-10T17:00:00Z","影響度":"高","対応策":"1月20日に顧客法務部門との緊急会議を開催し、契約書の懸念事項を整理する。並行して、弁護士による修正案を準備し、1月27日までに顧客へ提出する。最悪の場合、プロジェクト開始を2月28日に延期することで合意を取り付ける。","作成日時":"2025-01-13T09:30:00Z","作成者ID":"rec-302","更新日時":"2025-01-16T14:15:00Z","更新者ID":"rec-301"},{"課題ID":"rec-001","商談ID":"rec-002","顧客ID":"rec-003","課題タイプ":"リスク","タイトル":"顧客担当者異動に伴う意思決定権者の確認と関係構築","説明":"株式会社マルベリー 調達部の鈴木課長が異動となり、新しい意思決letalaker は未確定。現在の契約更新交渉が2月末に控えており、権限を持つ担当者の確定と早期の関係構築が必須。異動先の田中部長との面談設定が急務。","優先度":"高","ステータス":"進行中","担当者ID":"rec-004","期限日":"2025-02-15T17:00:00Z","影響度":"高","対応策":"1月中に顧客先を訪問し新体制を確認。田中部長および関連メンバーとの初回打ち合わせを設定。既存の契約条件・課題点を整理し、新担当者への引き継ぎ資料を作成。2月初旬までに意思決定ルートを確定させる。","作成日時":"2025-01-06T09:30:00Z","作成者ID":"rec-005","更新日時":"2025-01-10T14:15:00Z","更新者ID":"rec-005"},{"課題ID":"rec-001","商談ID":"rec-0042","顧客ID":"rec-0156","課題タイプ":"リスク","タイトル":"納入予定の部材調達遅延による納期延期のリスク","説明":"韓国サプライヤーからの重要部材（制御基板）の納入が予定より2週間遅延する見通し。これにより顧客への納期が2024年12月15日から2025年1月5日に延期される可能性が高い。顧客の生産計画に大きな影響を与え、契約違約金発生のリスクあり。","優先度":"高","ステータス":"進行中","担当者ID":"rec-0089","期限日":"2024-11-30T18:00:00Z","影響度":"高","対応策":"1) 代替サプライヤー2社への緊急発注検討、2) 顧客への早期連絡と納期変更交渉、3) 現在のサプライヤーへの船便変更（航空便への切り替え）要請、4) 部材の一部先行納入の可能性調査","作成日時":"2024-11-08T09:30:00Z","作成者ID":"rec-0067","更新日時":"2024-11-15T14:20:00Z","更新者ID":"rec-0089"},{"課題ID":"rec-001","商談ID":"rec-042","顧客ID":"rec-015","課題タイプ":"リスク","タイトル":"顧客の経営方針変更による導入計画の一時中断","説明":"A社の経営方針が変更され、新規システム導入プロジェクトが一時中断となった。顧客側の経営層から、2025年度の予算配分見直しに伴い、当面の間は導入を延期する旨の連絡を受けた。既に基本設計フェーズまで進行していたため、現在の進捗状況の整理と今後のスケジュール再調整が必要。","優先度":"高","ステータス":"進行中","担当者ID":"rec-108","期限日":"2025-02-28T17:00:00Z","影響度":"高","対応策":"1. 顧客の経営方針変更の詳細ヒアリングを実施し、再開時期の見通しを確認する。2. 現在までの設計資産をドキュメント化し、再開時の引継ぎ準備を完了させる。3. 営業担当者を通じて、顧客の経営層との定期的な情報交換体制を構築する。4. 再開時期が決定した際の迅速な体制復帰計画を立案する。","作成日時":"2025-01-15T10:30:00Z","作成者ID":"rec-203","更新日時":"2025-01-22T14:15:00Z","更新者ID":"rec-108"},{"課題ID":"rec-001","商談ID":"rec-042","顧客ID":"rec-108","課題タイプ":"アクションアイテム","タイトル":"提案内容の認識齟齬を解決する営業チーム内調整","説明":"A社向けシステム導入提案について、営業担当者間で提案範囲と納期の認識が異なっている。営業1課の鈴木は基本機能のみの3ヶ月納期を想定しているのに対し、営業2課の佐藤はカスタマイズを含む6ヶ月納期を想定している。このままでは顧客への提案時点で矛盾が生じる可能性があり、チーム内で提案内容を統一する必要がある。","優先度":"高","ステータス":"進行中","担当者ID":"rec-215","期限日":"2025-01-24T17:00:00Z","影響度":"高","対応策":"営業部長・山田花子を中心に、営業1課・営業2課の担当者を交えて提案内容確認会議を開催。顧客要件ヒアリング結果を再整理し、基本機能とカスタマイズの範囲を明確化する。確定した提案内容をドキュメント化し、全営業チームで共有する。2025年1月20日までに統一提案書を完成させ、顧客への正式提案を1月27日に実施予定。","作成日時":"2025-01-10T09:30:00Z","作成者ID":"rec-215","更新日時":"2025-01-17T14:15:00Z","更新者ID":"rec-215"},{"課題ID":"rec-001","商談ID":"rec-042","顧客ID":"rec-108","課題タイプ":"アクションアイテム","タイトル":"既存顧客からの追加機能要望への対応可否判定","説明":"株式会社鈴木製作所より、現在導入されているシステムに対して新たに <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper ( SPA 版と同じ )
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API ( SPA 版と同じ )
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー ( " + op + " ): APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return;
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。 無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。 抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  document.addEventListener("DOMContentLoaded", function() {
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // content 要素の hidden 強制除去 ( 2026-05-24 Playwright 大量 fail 対応 )
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/\bmodal\b|\bdialog\b|\boverlay\b|\bpopup\b|\bdropdown\b|\btooltip\b/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup") || el.hasAttribute("data-aivic-overlay"))) return true;
      // 【2026-06-25】 class/role が無くても inline で画面を覆う overlay ( position:fixed ) は modal 扱いにして、
      //  content 強制可視化が誤ってダイアログをロード時に表示してしまわないようにする。
      if (el.style && el.style.position === "fixed") return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        if (isModalLike(el)) continue;
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      _aivicReady = true;
    });
  });

  // 【2026-06-27 強化・必ず閉じられる保証】 モーダル/ダイアログを確実に閉じる安全網。
  //  旧版は Esc のみ + セレクタ .overlay が class="modal-overlay" にマッチせず ( クラストークンが別 )
  //  閉じられなかった ( ユーザー報告 2026-06-27: ダイアログが閉じない ) 。 ① Esc ② オーバーレイ背景クリック
  //  ③ 閉じる系ボタン の 3 経路で閉じる。 セレクタは複合クラスも拾うよう [class*="overlay"] を含む。
  //  閉じ方は「開クラス ( active/open/show 等 ) があれば外す ( 再オープン可 ) 、 無ければ inline display:none」。
  //  modal-header 等の sub-part を誤って隠さないため [class*="modal"] は使わない。
  var AIVIC_OVERLAY_SELECTOR = '[class*="overlay"],[data-aivic-overlay],[data-modal],[role="dialog"],[role="alertdialog"]';
  var aivicCloseOverlay = function(el) {
    if (!el || !el.classList) return;
    var openClasses = ["active", "open", "show", "visible", "is-open", "is-active", "show-modal"];
    var removed = false;
    for (var c = 0; c < openClasses.length; c++) {
      if (el.classList.contains(openClasses[c])) { el.classList.remove(openClasses[c]); removed = true; }
    }
    if (!removed && el.style) el.style.display = "none";
  };
  document.addEventListener("keydown", function(e) {
    if (e.key !== "Escape" && e.keyCode !== 27) return;
    var ov = document.querySelectorAll(AIVIC_OVERLAY_SELECTOR);
    for (var i = 0; i < ov.length; i++) aivicCloseOverlay(ov[i]);
  });
  document.addEventListener("click", function(e) {
    var t = e.target;
    if (!t) return;
    if (t.closest) {
      var closer = t.closest('.modal-close,[data-modal-close],[data-close],[data-dismiss]');
      if (closer) {
        var oc = closer.closest(AIVIC_OVERLAY_SELECTOR);
        if (oc) { aivicCloseOverlay(oc); return; }
      }
    }
    // 背景 ( オーバーレイ要素そのもの ) を直接クリックした時のみ閉じる ( モーダル本体クリックでは閉じない ) 。
    if (t.matches && t.matches(AIVIC_OVERLAY_SELECTOR) && t === e.target) {
      aivicCloseOverlay(t);
    }
  });
  // 【2026-06-28 強化・ロード時に必ず閉じる】 生成 AI が overlay を初期 display:none にし忘れた場合でも、
  //  ロード直後にダイアログが画面を覆って操作不能になる事故 ( ユーザー報告 2026-06-28: ダイアログが常に表示され
  //  閉じられない ) を防ぐ。 認識可能な overlay/dialog セレクタに該当する要素はロード時に必ず閉じる
  //  ( 開クラス除去 or display:none ) 。 真にロード時表示すべき業務コンテンツは overlay セレクタに該当しないため
  //  影響しない ( パネルコンテナは data-aivic-panel で別管理 ) 。
  var aivicHideOverlaysOnLoad = function() {
    var ov = document.querySelectorAll(AIVIC_OVERLAY_SELECTOR);
    for (var i = 0; i < ov.length; i++) aivicCloseOverlay(ov[i]);
  };
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", aivicHideOverlaysOnLoad);
  } else {
    aivicHideOverlaysOnLoad();
  }
})();

</script>
