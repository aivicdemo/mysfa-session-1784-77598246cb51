<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>顧客向けポータル</title>
  <style>
:root {
  --primary: #0070d2;
  --primary-hover: #005fb8;
  --bg-main: #f3f3f3;
  --bg-card: #ffffff;
  --bg-sidebar: #f8f8f8;
  --border: #d3d3d3;
  --text: #1a1a1a;
  --text-muted: #565656;
  --top-bar-bg: #ffffff;
  --top-bar-border: #d3d3d3;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  font-size: 13px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg-main);
}

.app-shell {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 48px;
  padding: 0 20px;
  background: var(--top-bar-bg);
  border-bottom: 1px solid var(--top-bar-border);
  flex-shrink: 0;
}

.logo {
  font-weight: 600;
  font-size: 14px;
  color: var(--text);
  letter-spacing: -0.3px;
}

.user-section {
  display: flex;
  align-items: center;
  gap: 10px;
}

.user-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  font-weight: 600;
  font-size: 12px;
}

.user-name {
  font-size: 12px;
  color: var(--text);
}

.logout-link {
  font-size: 12px;
  color: var(--primary);
  text-decoration: none;
  cursor: pointer;
  transition: color 0.2s;
}

.logout-link:hover {
  color: var(--primary-hover);
}

.main-container {
  display: flex;
  flex: 1;
  overflow: hidden;
}

.sidebar {
  width: 240px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  flex-shrink: 0;
}

.sidebar-section {
  padding: 16px 0;
  border-bottom: 1px solid var(--border);
}

.sidebar-section:last-child {
  border-bottom: none;
}

.sidebar-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 0 16px 8px;
  letter-spacing: 0.5px;
}

.nav-item {
  display: block;
  padding: 8px 16px;
  color: var(--text);
  text-decoration: none;
  cursor: pointer;
  transition: background 0.15s;
  font-size: 13px;
}

.nav-item:hover {
  background: rgba(0, 112, 210, 0.08);
}

.nav-item.aivic-active {
  background: var(--primary);
  color: #ffffff;
  font-weight: 500;
}

.content-area {
  flex: 1;
  overflow-y: auto;
  background: var(--bg-main);
}

[data-aivic-panel] {
  display: block;
}

.panel-container {
  padding: 24px;
}

.page-header {
  margin-bottom: 24px;
}

.page-title {
  font-size: 20px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
  letter-spacing: -0.3px;
}

.page-subtitle {
  font-size: 12px;
  color: var(--text-muted);
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 16px;
}

.kpi-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}

.kpi-value {
  font-size: 24px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}

.kpi-change {
  font-size: 12px;
  color: var(--text-muted);
}

.table-wrapper {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
}

.table-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px;
  border-bottom: 1px solid var(--border);
}

.table-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}

.table-actions {
  display: flex;
  gap: 8px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

thead {
  background: #fafafa;
  border-bottom: 1px solid var(--border);
}

th {
  padding: 12px 16px;
  text-align: left;
  font-weight: 600;
  color: var(--text);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

td {
  padding: 12px 16px;
  border-bottom: 1px solid #f0f0f0;
  color: var(--text);
}

tbody tr:hover {
  background: #fafafa;
}

.status-badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.status-active {
  background: rgba(0, 112, 210, 0.1);
  color: var(--primary);
}

.status-pending {
  background: rgba(255, 171, 0, 0.1);
  color: #b37700;
}

.status-completed {
  background: rgba(0, 128, 96, 0.1);
  color: #006b50;
}

.status-inactive {
  background: rgba(128, 128, 128, 0.1);
  color: #565656;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg-card);
  color: var(--text);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
}

.btn:hover {
  background: #f5f5f5;
  border-color: #999;
}

.btn-primary {
  background: var(--primary);
  color: #ffffff;
  border-color: var(--primary);
}

.btn-primary:hover {
  background: var(--primary-hover);
  border-color: var(--primary-hover);
}

.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 12px;
  color: var(--text);
  background: var(--bg-card);
  font-family: inherit;
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 2px rgba(0, 112, 210, 0.1);
}

.form-textarea {
  resize: vertical;
  min-height: 100px;
}

.split-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  height: 100%;
}

.split-left {
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.split-right {
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.list-item {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.15s;
}

.list-item:hover {
  background: #fafafa;
}

.list-item.active {
  background: rgba(0, 112, 210, 0.08);
  border-left: 3px solid var(--primary);
  padding-left: 9px;
}

.detail-panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 20px;
}

.detail-section {
  margin-bottom: 20px;
}

.detail-section:last-child {
  margin-bottom: 0;
}

.detail-heading {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 12px;
  letter-spacing: 0.5px;
}

.detail-row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid #f0f0f0;
  font-size: 12px;
}

.detail-row:last-child {
  border-bottom: none;
}

.detail-label {
  color: var(--text-muted);
  font-weight: 500;
}

.detail-value {
  color: var(--text);
  font-weight: 500;
}

.timeline {
  position: relative;
  padding-left: 24px;
}

.timeline-item {
  position: relative;
  padding-bottom: 16px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.timeline-item:last-child {
  border-bottom: none;
}

.timeline-dot {
  position: absolute;
  left: -20px;
  top: 2px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--primary);
  border: 2px solid var(--bg-main);
}

.timeline-time {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.timeline-text {
  font-size: 12px;
  color: var(--text);
}

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
}

.empty-state-icon {
  font-size: 32px;
  margin-bottom: 12px;
  opacity: 0.5;
}

.empty-state-text {
  font-size: 13px;
  margin-bottom: 16px;
}

.filter-bar {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.filter-input {
  flex: 1;
  min-width: 200px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 12px;
  background: var(--bg-card);
}

.badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 3px;
  background: rgba(0, 112, 210, 0.1);
  color: var(--primary);
  font-size: 11px;
  font-weight: 600;
}

.divider {
  height: 1px;
  background: var(--border);
  margin: 16px 0;
}

onst customerModalCloseBtn = container.querySelector('#customer-modal-close-btn');\n\n  // 初期化\n  async function init() {\n    try {\n      // 帳票一覧を取得\n      allReports = await window.aivicApi.list(reportTableIndex) || [];\n      // 顧客一覧を取得\n      allCustomers = await window.aivicApi.list(customerTableIndex) || [];\n      \n      renderReportsList(allReports);\n    } catch (err) {\n      console.error('Failed to load data:', err);\n    }\n  }\n\n  // 帳票一覧をレンダリング\n  function renderReportsList(reports) {\n    reportsList.innerHTML = '';\n    reports.forEach(report => {\n      const item = document.createElement('div');\n      item.className = 'report-item';\n      item.dataset.id = report.id;\n      item.style.cssText = `\n        padding: 10px 12px;\n        border-bottom: 1px solid var(--border);\n        cursor: pointer;\n        background: ${selectedReportId === report.id ? 'var(--bg-main)' : 'var(--bg-card)'};\n        transition: background 0.2s;\n      `;\n      item.innerHTML = `\n        <div style=\"font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 2px;\">${report.reportName || '（無名）'}</div>\n        <div style=\"font-size: 11px; color: var(--text-muted);\">${report.reportType || '—'}</div>\n        <div style=\"font-size: 11px; color: ${report.isPublished ? 'var(--primary)' : 'var(--text-muted)'}; margin-top: 4px;\">\n          ${report.isPublished ? '🔓 公開中' : '🔒 非公開'}\n        </div>\n      `;\n      item.addEventListener('click', () => selectReport(report));\n      reportsList.appendChild(item);\n    });\n  }\n\n  // 帳票を選択して詳細を表示\n  function selectReport(report) {\n    selectedReportId = report.id;\n    selectedCustomerIds = new Set(report.targetCustomerIds || []);\n    renderReportsList(allReports);\n    renderDetailPanel(report);\n  }\n\n  // 詳細パネルをレンダリング\n  function renderDetailPanel(report) {\n    const publishedCustomers = allCustomers.filter(c => selectedCustomerIds.has(c.id));\n    \n    detailPanel.innerHTML = `\n      <div style=\"background: var(--bg-card); border-radius: 6px; padding: 16px; border: 1px solid var(--border);\">\n        <h2 style=\"margin: 0 0 16px 0; font-size: 16px; font-weight: 600; color: var(--text);\">${report.reportName}</h2>\n        \n        <div style=\"display: grid; gap: 12px; margin-bottom: 16px;\">\n          <div>\n            <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: 500; text-transform: uppercase;\">帳票タイプ</label>\n            <div style=\"font-size: 13px; color: var(--text);\">${report.reportType || '—'}</div>\n          </div>\n          \n          <div>\n            <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: 500; text-transform: uppercase;\">説明</label>\n            <div style=\"font-size: 13px; color: var(--text); white-space: pre-wrap; word-break: break-word;\">${report.description || '（説明なし）'}</div>\n          </div>\n\n          <div>\n            <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: 500; text-transform: uppercase;\">作成者</label>\n            <div style=\"font-size: 13px; color: var(--text);\">${report.createdBy || '—'}</div>\n          </div>\n\n          <div>\n            <label style=\"display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: 500; text-transform: uppercase;\">最終更新</label>\n            <div style=\"font-size: 13px; color: var(--text);\">${report.updatedAt ? new Date(report.updatedAt).toLocaleString('ja-JP') : '—'}</div>\n          </div>\n        </div>\n\n        <div style=\"border-top: 1px solid var(--border); padding-top: 12px; margin-bottom: 16px;\">\n          <div style=\"display: flex; align-items: center; gap: 8px; margin-bottom: 12px;\">\n            <input \n              type=\"checkbox\" \n              id=\"publish-toggle\"\n              ${report.isPublished ? 'checked' : ''}\n              style=\"cursor: pointer; accent-color: var(--primary);\"\n            />\n            <label for=\"publish-toggle\" style=\"font-size: 13px; color: var(--text); cursor: pointer; font-weight: 500;\">\n              ポータルで公開\n            </label>\n          </div>\n          \n          ${report.isPublished ? `\n            <div style=\"background: var(--bg-main); padding: 8px; border-radius: 4px; margin-bottom: 12px;\">\n              <div style=\"font-size: 11px; color: var(--text-muted); margin-bottom: 6px;\">公開対象顧客: <strong>${publishedCustomers.length}</strong> 件</div>\n              <div style=\"font-size: 12px; color: var(--text);\">\n                ${publishedCustomers.length > 0 \n                  ? publishedCustomers.slice(0, 3).map(c => c.customerName).join('、') + (publishedCustomers.length > 3 ? `ほか ${publishedCustomers.length - 3} 件` : '')\n                  : '（対象顧客なし）'\n                }\n              </div>\n            </div>\n          ` : ''}\n        </div>\n\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;\">\n          <button class=\"edit-report-btn action-btn secondary\" data-id=\"${report.id}\" style=\"padding: 8px 12px; font-size: 12px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer;\">\n            編集\n          </button>\n          <button class=\"select-customers-btn action-btn secondary\" data-id=\"${report.id}\" style=\"padding: 8px 12px; font-size: 12px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer;\">\n            対象顧客\n          </button>\n          <button class=\"delete-report-btn action-btn secondary\" data-id=\"${report.id}\" style=\"padding: 8px 12px; font-size: 12px; border: 1px solid var(--border); background: transparent; color: #d32f2f; cursor: pointer;\">\n            削除\n          </button>\n        </div>\n      </div>\n    `;\n\n    // イベントリスナー\n    const publishToggle = detailPanel.querySelector('#publish-toggle');\n    publishToggle.addEventListener('change', async (e) => {\n      const updated = await window.aivicApi.update(reportTableIndex, report.id, {\n        isPublished: e.target.checked\n      });\n      if (updated) {\n        const idx = allReports.findIndex(r => r.id === report.id);\n        if (idx >= 0) allReports[idx].isPublished = e.target.checked;\n        selectReport(allReports[idx]);\n      }\n    });\n\n    detailPanel.querySelector('.edit-report-btn').addEventListener('click', () => openEditModal(report));\n    detailPanel.querySelector('.select-customers-btn').addEventListener('click', () => openCustomerSelectModal(report));\n    detailPanel.querySelector('.delete-report-btn').addEventListener('click', () => openDeleteConfirmModal(report));\n  }\n\n  // 帳票追加モーダルを開く\n  function openAddModal() {\n    editingReportId = null;\n    modalTitle.textContent = '帳票を追加';\n    reportNameInput.value = '';\n    reportTypeSelect.value = '';\n    reportDescriptionTextarea.value = '';\n    reportModal.style.display = 'flex';\n  }\n\n  // 帳票編集モーダルを開く\n  function openEditModal(report) {\n    editingReportId = report.id;\n    modalTitle.textContent = '帳票を編集';\n    reportNameInput.value = report.reportName || '';\n    reportTypeSelect.value = report.reportType || '';\n    reportDescriptionTextarea.value = report.description || '';\n    reportModal.style.display = 'flex';\n  }\n\n  // 帳票追加・編集を保存\n  async function saveReport() {\n    const reportName = reportNameInput.value.trim();\n    const reportType = reportTypeSelect.value;\n    const description = reportDescriptionTextarea.value.trim();\n\n    if (!reportName || !reportType) {\n      alert('帳票名と帳票タイプは必須です');\n      return;\n    }\n\n    const data = {\n      reportName,\n      reportType,\n      description\n    };\n\n    let result;\n    if (editingReportId) {\n      result = await window.aivicApi.update(reportTableIndex, editingReportId, data);\n      if (result) {\n        const idx = allReports.findIndex(r => r.id === editingReportId);\n        if (idx >= 0) allReports[idx] = { ...allReports[idx], ...data };\n      }\n    } else {\n      result = await window.aivicApi.save(reportTableIndex, data);\n      if (result) allReports.push(result);\n    }\n\n    if (result) {\n      reportModal.style.display = 'none';\n      renderReportsList(allReports);\n    }\n  }\n\n  // 削除確認モーダルを開く\n  function openDeleteConfirmModal(report) {\n    pendingDeleteId = report.id;\n    container.querySelector('#delete-confirm-message').textContent = `「${report.reportName}」を削除しますか？この操作は取り消せません。`;\n    deleteConfirmModal.style.display = 'flex';\n  }\n\n  // 帳票を削除\n  async function deleteReport() {\n    if (!pendingDeleteId) return;\n    \n    const result = await window.aivicApi.delete(reportTableIndex, pendingDeleteId);\n    if (result) {\n      allReports = allReports.filter(r => r.id !== pendingDeleteId);\n      selectedReportId = null;\n      deleteConfirmModal.style.display = 'none';\n      renderReportsList(allReports);\n      detailPanel.innerHTML = '<div style=\"text-align: center; color: var(--text-muted); padding: 32px 16px;\">帳票を選択してください</div>';\n    }\n  }\n\n  // 公開対象顧客選択モーダルを開く\n  function openCustomerSelectModal(report) {\n    selectedCustomerIds = new Set(report.targetCustomerIds || []);\n    renderCustomerList(allCustomers);\n    customerSelectModal.style.display = 'flex';\n  }\n\n  // 顧客リストをレンダリング\n  function renderCustomerList(customers) {\n    customerList.innerHTML = '';\n    customers.forEach(customer => {\n      const label = document.createElement('label');\n      label.style.cssText = 'display: flex; align-items: center; gap: 8px; padding: 6px; cursor: pointer; border-radius: 4px; transition: background 0.2s;';\n      label.innerHTML = `\n        <input \n          type=\"checkbox\" \n          value=\"${customer.id}\"\n          ${selectedCustomerIds.has(customer.id) ? 'checked' : ''}\n          style=\"cursor: pointer; accent-color: var(--primary);\"\n        />\n        <span style=\"font-size: 13px; color: var(--text);\">${customer.customerName}</span>\n      `;\n      label.addEventListener('mouseenter', () => label.style.background = 'var(--bg-card)');\n      label.addEventListener('mouseleave', () => label.style.background = 'transparent');\n      label.querySelector('input').addEventListener('change', (e) => {\n        if (e.target.checked) {\n          selectedCustomerIds.add(customer.id);\n        } else {\n          selectedCustomerIds.delete(customer.id);\n        }\n      });\n      customerList.appendChild(label);\n    });\n  }\n\n  // 公開対象顧客を保存\n  async function saveCustomerSelection() {\n    const result = await window.aivicApi.update(reportTableIndex, selectedReportId, {\n      targetCustomerIds: Array.from(selectedCustomerIds)\n    });\n    if (result) {\n      const idx = allReports.findIndex(r => r.id === selectedReportId);\n      if (idx >= 0) allReports[idx].targetCustomerIds = Array.from(selectedCustomerIds);\n      customerSelectModal.style.display = 'none';\n      selectReport(allReports[idx]);\n    }\n  }\n\n  // 検索フィルタ\n  function filterReports(query) {\n    const filtered = allReports.filter(r => \n      r.reportName.toLowerCase().includes(query.toLowerCase())\n    );\n    renderReportsList(filtered);\n  }\n\n  // 顧客検索フィルタ\n  function filterCustomers(query) {\n    const filtered = allCustomers.filter(c =>\n      c.customerName.toLowerCase().includes(query.toLowerCase())\n    );\n    renderCustomerList(filtered);\n  }\n\n  // イベントリスナー登録\n  addReportBtn.addEventListener('click', openAddModal);\n  reportSearchInput.addEventListener('input', (e) => filterReports(e.target.value));\n  customerSearchInput.addEventListener('input', (e) => filterCustomers(e.target.value));\n\n  modalSaveBtn.addEventListener('click', saveReport);\n  modalCloseBtn.addEventListener('click', () => reportModal.style.display = 'none');\n  modalCancelBtn.addEventListener('click', () => reportModal.style.display = 'none');\n\n  deleteConfirmBtn.addEventListener('click', deleteReport);\n  deleteCancelBtn.addEventListener('click', () => deleteConfirmModal.style.display = 'none');\n\n  customerSaveBtn.addEventListener('click', saveCustomerSelection);\n  customerCancelBtn.addEventListener('click', () => customerSelectModal.style.display = 'none');\n  customerModalCloseBtn.addEventListener('click', () => customerSelectModal.style.display = 'none');\n\n  // Esc キーでモーダルを閉じる\n  document.addEventListener('keydown', (e) => {\n    if (e.key === 'Escape') {\n      reportModal.style.display = 'none';\n      deleteConfirmModal.style.display = 'none';\n      customerSelectModal.style.display = 'none';\n    }\n  });\n\n  // overlay クリックで閉じる\n  reportModal.addEventListener('click', (e) => {\n    if (e.target === reportModal) reportModal.style.display = 'none';\n  });\n  deleteConfirmModal.addEventListener('click', (e) => {\n    if (e.target === deleteConfirmModal) deleteConfirmModal.style.display = 'none';\n  });\n  customerSelectModal.addEventListener('click', (e) => {\n    if (e.target === customerSelectModal) customerSelectModal.style.display = 'none';\n  });\n\n  // 初期化実行\n  init();\n}";
</script>

  <div style="background: var(--bg-card); color: var(--text); padding: 24px; border-radius: 8px; max-width: 600px; width: 90%; max-height: 90vh; overflow: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.4);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h3 style="margin: 0; font-size: 16px; font-weight: 600;">公開対象顧客を選択</h3>
      <button id="customer-modal-close-btn" class="action-btn secondary" style="padding: 4px 8px; font-size: 12px; border: none; background: transparent; cursor: pointer; color: var(--text-muted);">✕</button>
    </div>

    <div style="margin-bottom: 12px;">
      <input 
        data-testid="customer-search-input"
        type="text" 
        placeholder="顧客名で検索..." 
        class="input"
        style="width: 100%; padding: 8px; border: 1px solid rgba(0,0,0,0.15); border-radius: 4px; background: var(--bg-main); color: var(--text); box-sizing: border-box; font-size: 12px;"
      />
    </div>

    <div style="max-height: 300px; overflow-y: auto; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-main); padding: 8px;">
      <div id="customer-list" style="display: grid; gap: 6px;">
        <!-- 顧客チェックボックスがここに動的に挿入される -->
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px;">
      <button id="customer-cancel-btn" class="action-btn secondary" style="padding: 8px 12px; font-size: 13px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer;">
        キャンセル
      </button>
      <button id="customer-save-btn" data-testid="save-customers-button" class="action-btn" style="padding: 8px 12px; font-size: 13px; background: var(--primary); color: #fff; border: none; cursor: pointer;">
        保存
      </button>
    </div>
  </div>
</div></div>
      </main>
    </div>
  </div>

  
<script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper ( SPA 版と同じ )
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API ( SPA 版と同じ )
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー ( " + op + " ): APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return;
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。 無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。 抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  document.addEventListener("DOMContentLoaded", function() {
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // content 要素の hidden 強制除去 ( 2026-05-24 Playwright 大量 fail 対応 )
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/\bmodal\b|\bdialog\b|\boverlay\b|\bpopup\b|\bdropdown\b|\btooltip\b/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup") || el.hasAttribute("data-aivic-overlay"))) return true;
      // 【2026-06-25】 class/role が無くても inline で画面を覆う overlay ( position:fixed ) は modal 扱いにして、
      //  content 強制可視化が誤ってダイアログをロード時に表示してしまわないようにする。
      if (el.style && el.style.position === "fixed") return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        if (isModalLike(el)) continue;
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      _aivicReady = true;
    });
  });

  // 【2026-06-27 強化・必ず閉じられる保証】 モーダル/ダイアログを確実に閉じる安全網。
  //  旧版は Esc のみ + セレクタ .overlay が class="modal-overlay" にマッチせず ( クラストークンが別 )
  //  閉じられなかった ( ユーザー報告 2026-06-27: ダイアログが閉じない ) 。 ① Esc ② オーバーレイ背景クリック
  //  ③ 閉じる系ボタン の 3 経路で閉じる。 セレクタは複合クラスも拾うよう [class*="overlay"] を含む。
  //  閉じ方は「開クラス ( active/open/show 等 ) があれば外す ( 再オープン可 ) 、 無ければ inline display:none」。
  //  modal-header 等の sub-part を誤って隠さないため [class*="modal"] は使わない。
  var AIVIC_OVERLAY_SELECTOR = '[class*="overlay"],[data-aivic-overlay],[data-modal],[role="dialog"],[role="alertdialog"]';
  var aivicCloseOverlay = function(el) {
    if (!el || !el.classList) return;
    var openClasses = ["active", "open", "show", "visible", "is-open", "is-active", "show-modal"];
    var removed = false;
    for (var c = 0; c < openClasses.length; c++) {
      if (el.classList.contains(openClasses[c])) { el.classList.remove(openClasses[c]); removed = true; }
    }
    if (!removed && el.style) el.style.display = "none";
  };
  document.addEventListener("keydown", function(e) {
    if (e.key !== "Escape" && e.keyCode !== 27) return;
    var ov = document.querySelectorAll(AIVIC_OVERLAY_SELECTOR);
    for (var i = 0; i < ov.length; i++) aivicCloseOverlay(ov[i]);
  });
  document.addEventListener("click", function(e) {
    var t = e.target;
    if (!t) return;
    if (t.closest) {
      var closer = t.closest('.modal-close,[data-modal-close],[data-close],[data-dismiss]');
      if (closer) {
        var oc = closer.closest(AIVIC_OVERLAY_SELECTOR);
        if (oc) { aivicCloseOverlay(oc); return; }
      }
    }
    // 背景 ( オーバーレイ要素そのもの ) を直接クリックした時のみ閉じる ( モーダル本体クリックでは閉じない ) 。
    if (t.matches && t.matches(AIVIC_OVERLAY_SELECTOR) && t === e.target) {
      aivicCloseOverlay(t);
    }
  });
  // 【2026-06-28 強化・ロード時に必ず閉じる】 生成 AI が overlay を初期 display:none にし忘れた場合でも、
  //  ロード直後にダイアログが画面を覆って操作不能になる事故 ( ユーザー報告 2026-06-28: ダイアログが常に表示され
  //  閉じられない ) を防ぐ。 認識可能な overlay/dialog セレクタに該当する要素はロード時に必ず閉じる
  //  ( 開クラス除去 or display:none ) 。 真にロード時表示すべき業務コンテンツは overlay セレクタに該当しないため
  //  影響しない ( パネルコンテナは data-aivic-panel で別管理 ) 。
  var aivicHideOverlaysOnLoad = function() {
    var ov = document.querySelectorAll(AIVIC_OVERLAY_SELECTOR);
    for (var i = 0; i < ov.length; i++) aivicCloseOverlay(ov[i]);
  };
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", aivicHideOverlaysOnLoad);
  } else {
    aivicHideOverlaysOnLoad();
  }
})();

</script>
</body>
</html>
