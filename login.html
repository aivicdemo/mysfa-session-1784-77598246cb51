<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MySFA - ログイン画面</title>
  <style>
    :root {
      --primary: #0070d2;
      --primary-hover: #005fb8;
      --bg-main: #f3f3f3;
      --bg-card: #ffffff;
      --bg-sidebar: #f8f8f8;
      --border: #d3d3d3;
      --text: #1a1a1a;
      --text-muted: #565656;
      --top-bar-bg: #ffffff;
      --top-bar-border: #d3d3d3;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: var(--bg-main);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      background: var(--bg-card);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      padding: 48px 32px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }

    .login-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      display: block;
    }

    .form-group input {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 14px;
      color: var(--text);
      background: var(--bg-card);
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 112, 210, 0.1);
    }

    .form-group input::placeholder {
      color: var(--text-muted);
    }

    .login-button {
      padding: 10px 16px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 8px;
    }

    .login-button:hover {
      background: var(--primary-hover);
    }

    .login-button:active {
      transform: scale(0.98);
    }

    .login-footer {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 32px 24px;
      }

      .login-header {
        margin-bottom: 24px;
      }

      .login-title {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">MySFA</div>
      <h1 class="login-title" data-testid="login-title">ログイン</h1>
      <p class="login-subtitle">営業管理システムへようこそ</p>
    </div>

    <form class="login-form" data-testid="login-form" novalidate>
      <div class="form-group">
        <label for="username">ユーザー名</label>
        <input
          type="text"
          id="username"
          name="username"
          data-testid="username"
          placeholder="ユーザー名を入力"
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label for="password">パスワード</label>
        <input
          type="password"
          id="password"
          name="password"
          data-testid="password"
          placeholder="パスワードを入力"
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="login-button" data-testid="login-button">
        ログイン
      </button>
    </form>

    <div class="login-footer">
      <p>※ サンプル実装では、どの入力でもログインできます</p>
    </div>
  </div>

  <script>
    document.querySelector('[data-testid="login-form"]').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = './index.html';
    });
  </script>
</body>
</html>
